version: 1
applications:
  - appRoot: app
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - npm ci
        build:
          commands:
            - NITRO_PRESET=aws-amplify npm run build
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - ~/.npm/**/*
