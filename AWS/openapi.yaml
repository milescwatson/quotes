components:
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
        environment:
          type: string
      required:
        - status
        - service
        - environment
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
            required:
              - path
              - code
              - message
          minItems: 0
        currentVersionId:
          type: string
          maxLength: 19
          pattern: ^[1-9][0-9]{0,18}$
      required:
        - code
        - message
        - requestId
      additionalProperties: false
    QuoteLineInput:
      type: object
      properties:
        id:
          type: string
          nullable: true
        taxonomyId:
          type: string
          nullable: true
        versionId:
          type: string
          nullable: true
        selections:
          type: array
          maxItems: 50
          items:
            type: string
            nullable: true
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        multiple:
          type: number
          minimum: 0
          maximum: 1000
          multipleOf: 0.0001
          default: 1
        kind:
          type: string
          enum:
            - configured
            - regular
            - freeform
        regularProductId:
          type: string
          nullable: true
        partNumber:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 500
        listPrice:
          type: string
      required:
        - id
        - quantity
      additionalProperties: false
      description: Configured lines require taxonomyId, versionId and selections.
        Regular lines require regularProductId. Freeform lines require partNumber,
        description and listPrice. Server validates fields by kind.
    QuoteSnapshotContent:
      type: object
      additionalProperties: false
      properties:
        productFamilyName:
          type: string
          maxLength: 120
          minLength: 1
        productDescription:
          type: string
          maxLength: 1000
          nullable: true
        separators:
          type: array
          description: One separator per gap between segments; omitted values default to dashes.
          maxItems: 49
          items:
            type: string
            enum:
              - "-"
              - ""
        currency:
          type: string
          enum:
            - USD
        basePrice:
          type: string
          maxLength: 15
          pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,2})?$
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TaxonomySegment"
          minItems: 0
          maxItems: 50
        schemaVersion:
          type: integer
          enum:
            - 1
      required:
        - productFamilyName
        - currency
        - basePrice
        - segments
        - schemaVersion
    QuoteConfigurationSnapshot:
      type: object
      properties:
        content:
          $ref: "#/components/schemas/QuoteSnapshotContent"
        principalId:
          type: string
          nullable: true
        principalName:
          type: string
          nullable: true
      required:
        - content
        - principalId
        - principalName
      additionalProperties: false
    QuoteLine:
      type: object
      properties:
        id:
          type: string
        taxonomyId:
          type: string
          nullable: true
        versionId:
          type: string
          nullable: true
        selections:
          type: array
          maxItems: 50
          items:
            type: string
            nullable: true
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        snapshot:
