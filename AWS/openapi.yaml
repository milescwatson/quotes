              message:
                type: string
            required:
              - path
              - code
              - message
          minItems: 0
        currentVersionId:
          type: string
          maxLength: 19
          pattern: ^[1-9][0-9]{0,18}$
      required:
        - code
        - message
        - requestId
      additionalProperties: false
