        identitySource: $request.header.Authorization
        jwtConfiguration:
          issuer: ${issuer}
          audience:
            - ${client_id}

x-amazon-apigateway-cors:
  allowOrigins:
    - ${frontend_url}
    - http://localhost:3000
  allowMethods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowHeaders:
    - authorization
    - content-type
  maxAge: 300
